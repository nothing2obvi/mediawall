services:
  mediawall:
    build: .
    container_name: mediawall
    env_file:
      - .env
    ports:
      - "0.0.0.0:1221:1221"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
      - ./app/sounds:/app/sounds:ro
      - ./app/custom_logo:/app/custom_logo:ro
      - ./app/collections:/app/collections:ro
      - ./app/avatars:/app/avatars:ro
      # Optional. Mount local music files when using Navidrome local artwork lookup and editing.
      # - /path/to/music:/navidrome_music:rw
    restart: unless-stopped
