library:
  directory: /library

server:
  port: 1221

library_scan:
  enabled: true
  ttl_days: 30
  scan_on_startup: true
  cron:
    enabled: true
    expression: "0 3 * * *"

jellyfin:
  url: "${JELLYFIN_URL}"
  api_key: "${JELLYFIN_API_KEY}"

subsonic:
  name: "Navidrome"
  icon: "navidrome"
  enabled: false
  url: "${SUBSONIC_URL}"
  artwork:
    jellyfin_fallback: true
    local_files: false
    order:
      - jellyfin
      - local
    path_mappings:
      - subsonic: "/music"
        mediawall: "/navidrome_music"

external_music:
  enabled: false
  session_timeout_seconds: 90
  track_transition_grace_seconds: 10
  artwork:
    preference: local
    minimum_backdrop_resolution: 1920x1080
    backdrop_count: 3
    album_cache_directory: /app/data/external-artwork
    album_cache_ttl_days: 30
  tokens: {}

image_providers:
  musicbrainz:
    enabled: true
    contact: "${MUSICBRAINZ_CONTACT}"
  fanart:
    enabled: true
    api_key: "${FANART_API_KEY}"
  theaudiodb:
    enabled: true
    api_key: "${THEAUDIODB_API_KEY}"
  cover_art_archive:
    enabled: true

users:
  bob:
    jellyfin_user: "${JELLYFIN_BOB_USER}"
    subsonic_user: "${SUBSONIC_BOB_USER}"
    subsonic_password: "${SUBSONIC_BOB_PASSWORD}"
    external_music_token: "${EXTERNAL_MUSIC_BOB_TOKEN}"
  alice:
    jellyfin_user: "${JELLYFIN_ALICE_USER}"
    subsonic_user: "${SUBSONIC_ALICE_USER}"
    subsonic_password: "${SUBSONIC_ALICE_PASSWORD}"
    external_music_token: "${EXTERNAL_MUSIC_ALICE_TOKEN}"
  charlie:
    # Example user that follows every Jellyfin account.
    jellyfin_user: "All"

spaces:
  livingroom:
    playback_source: All
    theme: All
    users:
      - All
    # Uses the top-level MediaWall user keys; shown always wins.
    anonymous_mode:
      enabled: false
      shown: []
      not_shown: [ All ]
      anonymous_username: someone
      now_playing_info:
        show_anonymous_username: true
        show_anonymous_avatar: true
      user_transition_info:
        show_anonymous_avatar: true
    password: "${LIVINGROOM_PASSWORD}"
    libraries:
      - Music
      - Movies
      - Shows
    page_refresh:
      enabled: false
      time: "06:00" # Daily, in the display browser's local timezone.
    idle_timeout: 30
    now_playing:
      fallback: mediawall
      immich_kiosk:
        url: ""
      ignored_libraries:
        - "Feature Pre-Rolls"
      fallback_shuffle_interval_seconds: 45
      cycle_users: true
      cycle_interval_seconds: 15
      session_cleanup:
        paused_after_seconds: 15
        missing_after_seconds: 5
      session_timer:
        enabled: true
        size: 42
      session_count:
        enabled: true
        font_size: 13
      user_transition:
        enabled: true
        duration_seconds: 5
        background_color: "#000000"
        avatar_size: 240
        username_font_size: 126
        message_font_size: 71
        source_icon_size: 150
      mediawall_fallback:
        modes:
          - dvd
        image: banner
        background_color: "#565954"
        min_logo_width: 260
        max_logo_width: 760
        sizes:
          centered: 760
          breathing: 760
          float: 700
          spotlight: 760
          dvd: 520
          minimal: 300
      custom_logo:
        directory: "/app/custom_logo"
      multiple_backdrops:
        enabled: true
        interval_seconds: 15
      collections:
        enabled: false
        global:
          enabled: false
          sound: "toned.mp3"
          user_transition_image: ""
          image_size: 260
        groups: []
      sounds:
        enabled: true
        sources:
          jellyfin: true
          subsonic: true
          external_music: true
        quiet_hours:
          enabled: false
          start: "23:00"
          end: "08:00"
        continuous_sessions:
          subsonic: true
          jellyfin_libraries:
            - Music
            - Music Videos
          external_music: true
        session_start:
          retrigger_after_inactive_seconds: 30
        session_end:
          enabled: false
          tone: "close.mp3"
        trigger: new_session
        directory: "/app/sounds"
        tone: "noted.mp3"
        volume: 0.35
    display:
      ui:
        scale: 0.85
      music_artist_images: albumartists
      music_logo_artist: artists
      cycle_interval_seconds: 15
      require_logos: true
      backdrop_background_color: "#050508"
      multiple_backdrops:
        mode: single_backdrop
        single_backdrop: random
        cycle_order: numbered
      animations:
        style: kenburns
        enabled: true
        scale: 1.08
        duration_seconds: 26
      logo:
        max_width: 520
      live_tv:
        channel_image_size: 713 # Centered channel image bounding box, in pixels.
      album_art:
        size: 300
      fallback_title:
        font_size: 86
      nowplaying_text:
        enabled: true
        text: "Now playing on"
        show_text: true
        font_size: 16
        show_source_icon: true
        icon_size: 24
        show_user_avatar: true
        user_avatar_size: 24
        user_avatar_resize:
          enabled: true
          size: 96
        show_jellyfin_username: true
        show_subsonic_username: true
        user_font_size: 13
      screensaver_text:
        enabled: true
        text: "Featured on MediaWall"
        font_size: 16
        icon_size: 24
      media_info:
        font_size: 40
        release_year_font_size: 40
        episode_info_font_size: 28
        episode_title_font_size: 40
        music_album_font_size: 24
        music_song_title_font_size: 40
      transitions:
        duration_ms: 1200
        order: written
        styles:
          - crossfade
      # Inherits album_art.size; set size here to override it for music videos.
      music_video_indicator:
        enabled: true
        text: "[MV]"
      music_video_album_art: {}

